[project]
name = "ecapi"
version = "1.0.0"
description = "Static JSON API of university extracurriculars, built by GitHub Actions and served by GitHub Pages"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12", "pydantic>=2.6", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecapi = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
